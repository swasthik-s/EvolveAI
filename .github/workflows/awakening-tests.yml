name: Awakening regression tests

on:
  push:
    paths:
      - "snn/awakening.py"
      - "snn/awakening_benchmark.py"
      - "snn/evolve_cell.py"
      - "snn/model.py"
      - "tests/test_awakening.py"
      - ".github/workflows/awakening-tests.yml"
  pull_request:
    paths:
      - "snn/awakening.py"
      - "snn/awakening_benchmark.py"
      - "snn/evolve_cell.py"
      - "snn/model.py"
      - "tests/test_awakening.py"
      - ".github/workflows/awakening-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest "torch>=2.2,<3.0"
      - name: Run Awakening regression tests
        run: python -m pytest -q tests/test_awakening.py
